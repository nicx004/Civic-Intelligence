version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: civic-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./frontend/.env

    depends_on:
      - postgres

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  postgres:
    image: postgres:16

    container_name: civic-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: civic_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: